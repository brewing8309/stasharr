# Push a tag v<version> → tests → Mozilla signs the build (unlisted) → GitHub release with
# stasharr-<version>.xpi attached, which is where updates.json points installs.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Tag matches manifest version
        id: version
        run: |
          version=$(node -p 'require("./manifest.json").version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Tests
        run: node --test

      - name: Lint
        run: npx --yes web-ext@10.7.0 lint --self-hosted --ignore-files tests updates.json

      - name: Sign
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --yes web-ext@10.7.0 sign --channel=unlisted \
            --ignore-files tests updates.json \
            --artifacts-dir web-ext-artifacts
          mv web-ext-artifacts/*.xpi "stasharr-${{ steps.version.outputs.version }}.xpi"

      # Mozilla signs each version only once. If a later step fails, the signed file is still
      # here and can be attached to the release by hand instead of bumping the version.
      - uses: actions/upload-artifact@v7
        with:
          name: stasharr-${{ steps.version.outputs.version }}
          path: stasharr-${{ steps.version.outputs.version }}.xpi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" "stasharr-$VERSION.xpi" \
            --title "stasharr $VERSION" --notes-file notes.md --verify-tag
