# Push a tag v<version> → tests → Mozilla signs the build (unlisted) → GitHub release with
# stasharr-<version>.xpi attached, which is where updates.json points installs.
#
# Hardening: actions pinned by commit SHA, web-ext installed from package-lock.json without
# install scripts, no git credentials left on disk, and the job holding the AMO keys can only read
# the repo. Only the last job, which runs no third-party code, may create the release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  sign:
    runs-on: ubuntu-latest
    # Holds AMO_JWT_ISSUER / AMO_JWT_SECRET; its deployment policy only admits v* tags.
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Tag matches manifest version
        id: version
        run: |
          version=$(node -p 'require("./manifest.json").version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Tests
        run: node --test

      - name: Install web-ext (locked)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npx --no-install web-ext lint --self-hosted --ignore-files tests docs updates.json package.json package-lock.json

      - name: Sign
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --no-install web-ext sign --channel=unlisted \
            --ignore-files tests docs updates.json package.json package-lock.json \
            --artifacts-dir web-ext-artifacts
          mv web-ext-artifacts/*.xpi "stasharr-${{ steps.version.outputs.version }}.xpi"

      # Mozilla signs each version only once. If a later step fails, the signed file is still
      # here and can be attached to the release by hand instead of bumping the version.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stasharr-${{ steps.version.outputs.version }}
          path: stasharr-${{ steps.version.outputs.version }}.xpi

  publish:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stasharr-${{ needs.sign.outputs.version }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.sign.outputs.version }}
        run: |
          awk -v v="$VERSION" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" "stasharr-$VERSION.xpi" \
            --title "stasharr $VERSION" --notes-file notes.md --verify-tag
